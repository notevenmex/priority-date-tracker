[project]
name = "pdtracker"
dynamic = ["version"]
description = "Priority date and Visa Bulletin tracker for immigration law offices"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "pypdf>=4.0", "tzdata; sys_platform == 'win32'"]  # Windows has no time zone database of its own

[project.optional-dependencies]
m365 = ["msal>=1.28"]
dev = ["pytest>=8", "msal>=1.28", "reportlab>=4.0"]

[project.scripts]
pdtrack = "pdtracker.cli:main"
pdtrack-app = "pdtracker.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "pdtracker.__version__"}

[tool.setuptools]
packages = ["pdtracker", "pdtracker.demo"]

[tool.setuptools.package-data]
"pdtracker.demo" = ["*.pdf"]

[tool.pytest.ini_options]
pythonpath = ["."]
